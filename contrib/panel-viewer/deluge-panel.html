<!DOCTYPE html>
<!--
  Deluge Panel Viewer - live mirror of the Deluge front panel over USB MIDI (WebMIDI).

  Companion to the firmware's panel-state stream (ENABLE_PANEL_STREAM, HIDSysex subcommand 3).
  Shows: pad grid (RGB), OLED, button LEDs (with real blink phase), gold-knob level meters,
  and gesture overlays for physical input (button press/hold, pad hits, encoder turns).

  Protocol (all sysex, Deluge header F0 00 21 7B 01):
    -> F0 hdr 02 00 03 F7   subscribe OLED (force), then mode 02 as ~1s keepalive
    -> F0 hdr 02 03 03 F7   subscribe panel state (force), then mode 02 as ~1s keepalive
    <- F0 hdr 02 40 02 <start> <len> <rle> F7          OLED delta (8-byte units)
    <- F0 hdr 02 42 00 <firstRow> <numRows> <rle> F7   pad rows (54 bytes/row RGB)
    <- F0 hdr 02 43 <type> <a> <b> <c> F7              events:
         0=LED (ledCode = x+9y, state), 1=knob meter (which, level 0-127),
         2=button input (btnCode = 9(y+16)+x, on), 3=pad input (x, y, velocity),
         4=encoder turn (id: 0=vert 1=horiz 2=tempo 3=select 4=goldLower 5=goldUpper, delta+64)
  The event vocabulary is direction-agnostic by design: a future emulator can accept the same
  button/pad/encoder messages as *inbound* input injection.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deluge Panel</title>
<style>
  :root {
    --panel: #1c1d21; --panel-edge: #2c2d33; --bg: #101114;
    --pad-off: #26272c; --btn: #33343a; --btn-edge: #45464e;
    --led-off: #3a3b40; --led-on: #7fd4ff; --accent: #e8b84b;
    --text: #b9bcc4; --dim: #6b6e78;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif;
         margin: 0; padding: 18px; display: flex; flex-direction: column; align-items: center; }
  #bar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  #bar select, #bar button { background: var(--btn); color: var(--text); border: 1px solid var(--btn-edge);
         border-radius: 6px; padding: 5px 10px; font: inherit; }
  #status { color: var(--dim); }
  #status.ok { color: #7ed491; }

  #deluge { background: linear-gradient(160deg, #202127, var(--panel) 40%);
            border: 1px solid var(--panel-edge); border-radius: 14px; padding: 22px;
            display: grid; grid-template-columns: auto auto 1fr auto; gap: 18px;
            box-shadow: 0 12px 40px #0009; }

  /* screen row spans all */
  #screenRow { grid-column: 1 / -1; display: flex; gap: 22px; align-items: center; }
  #oledWrap { background: #000; border: 2px solid #34353b; border-radius: 6px; padding: 8px; }
  #oled { image-rendering: pixelated; display: block; }
  .brand { color: var(--dim); font-size: 15px; letter-spacing: 3px; font-weight: 600; }

  /* gold knobs */
  #goldCol { display: flex; flex-direction: column; gap: 26px; justify-content: center; }
  .goldUnit { display: flex; gap: 8px; align-items: center; }
  .meter { display: flex; flex-direction: column-reverse; gap: 2px; height: 84px; }
  .meter i { width: 5px; flex: 1; background: var(--led-off); border-radius: 2px; }
  .meter i.on { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

  .knob { position: relative; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #4a4b52, #232428 70%);
          border: 2px solid #55565e; }
  .knob.gold { width: 84px; height: 84px;
          background: radial-gradient(circle at 35% 30%, #d9b45e, #7a5f22 75%); border-color: #a8894a; }
  .knob .dot { position: absolute; left: 50%; top: 9%; width: 12%; height: 12%; margin-left: -6%;
          border-radius: 50%; background: #14151a; transform-origin: 50% 340%; }
  .knob.small { width: 54px; height: 54px; }
  .knob.pressed { box-shadow: 0 0 0 4px #fff5, 0 0 18px #fff4; }
  .knob .arrow { position: absolute; inset: -14px; border-radius: 50%; opacity: 0;
          border: 3px solid transparent; }
  .knob .arrow.cw  { border-top-color: var(--led-on); border-right-color: var(--led-on); }
  .knob .arrow.ccw { border-top-color: var(--led-on); border-left-color: var(--led-on); }
  .knob .arrow.show { animation: spinfade .45s ease-out; }
  @keyframes spinfade {
    0% { opacity: 1; transform: rotate(0deg); }
    100% { opacity: 0; transform: rotate(var(--spin, 60deg)); }
  }
  .kLabel { text-align: center; color: var(--dim); font-size: 10px; margin-top: 4px;
            text-transform: uppercase; letter-spacing: 1px; }

  /* mod buttons 2x4 */
  #modCol { display: grid; grid-template-columns: repeat(2, auto); gap: 10px; align-content: center; }

  /* pads */
  #padArea { display: flex; gap: 14px; align-items: center; }
  #padGrid, #sidebar { display: grid; gap: 5px; }
  #padGrid { grid-template-columns: repeat(16, 30px); }
  #sidebar { grid-template-columns: repeat(2, 30px); }
  .pad { width: 30px; height: 30px; border-radius: 5px; background: var(--pad-off);
         position: relative; transition: background-color .05s; }
  .pad .ring, .btn .ring { position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
         border: 2px solid #fff; opacity: 0; }
  .pad.hit .ring, .btn.pressed .ring { animation: ripple .4s ease-out; }
  .pad.down { outline: 2px solid #ffffffcc; outline-offset: 1px; }
  @keyframes ripple {
    0% { opacity: .9; transform: scale(.7); }
    100% { opacity: 0; transform: scale(1.5); }
  }

  /* buttons */
  #btnCol { display: grid; grid-template-columns: repeat(4, auto); gap: 10px 12px; align-content: center; }
  .btn { position: relative; width: 58px; min-height: 34px; border-radius: 7px; background: var(--btn);
         border: 1px solid var(--btn-edge); color: var(--dim); font-size: 9px; text-transform: uppercase;
         letter-spacing: .5px; display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 3px; padding: 4px; text-align: center; user-select: none; }
  .btn .led { width: 8px; height: 8px; border-radius: 50%; background: var(--led-off); }
  .btn .led.on { background: var(--led-on); box-shadow: 0 0 8px var(--led-on); }
  .btn.pressed { background: #4a4b54; color: var(--text); }
  .btn.held { box-shadow: 0 0 0 3px var(--accent), 0 0 14px var(--accent); }
  .btn.mod { width: 46px; min-height: 30px; }

  #encRow { grid-column: 1 / -1; display: flex; gap: 40px; justify-content: center; margin-top: 4px; }
</style>
</head>
<body>
<div id="bar">
  <select id="ports"></select>
  <button id="connect">Connect</button>
  <span id="status">WebMIDI not initialised</span>
</div>

<div id="deluge">
  <div id="screenRow">
    <span class="brand">DELUGE&nbsp;MIRROR</span>
    <div id="oledWrap"><canvas id="oled" width="128" height="48" style="width:384px;height:144px"></canvas></div>
    <div><div class="knob small" id="knob-tempo"><div class="dot"></div><div class="arrow"></div></div>
         <div class="kLabel">Tempo</div></div>
    <div><div class="knob small" id="knob-select"><div class="dot"></div><div class="arrow"></div></div>
         <div class="kLabel">Select</div></div>
  </div>

  <div id="goldCol">
    <div>
      <div class="goldUnit">
        <div class="meter" id="meter-1"></div>
        <div class="knob gold" id="knob-gold-upper"><div class="dot"></div><div class="arrow"></div></div>
      </div><div class="kLabel">Gold&nbsp;Upper</div>
    </div>
    <div>
      <div class="goldUnit">
        <div class="meter" id="meter-0"></div>
        <div class="knob gold" id="knob-gold-lower"><div class="dot"></div><div class="arrow"></div></div>
      </div><div class="kLabel">Gold&nbsp;Lower</div>
    </div>
  </div>

  <div id="modCol"></div>

  <div id="padArea">
    <div><div class="knob small" id="knob-vertical"><div class="dot"></div><div class="arrow"></div></div>
         <div class="kLabel">Vert</div></div>
    <div id="padGrid"></div>
    <div id="sidebar"></div>
  </div>

  <div id="btnCol"></div>

  <div id="encRow">
    <div><div class="knob small" id="knob-horizontal"><div class="dot"></div><div class="arrow"></div></div>
         <div class="kLabel">Horizontal</div></div>
  </div>
</div>

<script>
"use strict";

// ---------- control maps (from src/deluge/definitions_cxx.hpp coordinates) ----------
const BUTTONS = [ // [x, y, label]
  [3,0,"Affect Entire"],[3,1,"Song"],[3,2,"Clip"],[3,3,"Keyboard"],
  [5,0,"Synth"],[5,1,"Kit"],[5,2,"Midi"],[5,3,"CV"],
  [6,0,"Scale"],[6,1,"Load"],[6,2,"Cross Screen"],[6,3,"Save"],
  [7,0,"Learn"],[7,1,"Back"],[7,2,"Sync Scale"],[7,3,"Tap"],
  [8,0,"Shift"],[8,1,"Triplets"],[8,2,"Rec"],[8,3,"Play"],
];
const MOD_BUTTONS = [[1,0],[2,0],[1,1],[2,1],[1,2],[2,2],[1,3],[2,3]];
const ENC_CLICKS = { // buttonCode -> knob element id
  [btnCode(0,0)]: "knob-vertical",  [btnCode(0,1)]: "knob-horizontal",
  [btnCode(0,2)]: "knob-gold-lower",[btnCode(0,3)]: "knob-gold-upper",
  [btnCode(4,1)]: "knob-tempo",     [btnCode(4,3)]: "knob-select",
};
const ENC_TURN = ["knob-vertical","knob-horizontal","knob-tempo","knob-select",
                  "knob-gold-lower","knob-gold-upper"];

function btnCode(x, y) { return 9 * (y + 16) + x; }
function ledCode(x, y) { return x + 9 * y; }

// ---------- build DOM ----------
const btnByCode = {}, ledByCode = {}, padEls = [];
function makeButton(x, y, label, cls) {
  const el = document.createElement("div");
  el.className = "btn" + (cls ? " " + cls : "");
  el.innerHTML = `<div class="led"></div>${label}<div class="ring"></div>`;
  btnByCode[btnCode(x, y)] = el;
  ledByCode[ledCode(x, y)] = el.querySelector(".led");
  return el;
}
for (const [x, y] of MOD_BUTTONS) document.getElementById("modCol").appendChild(makeButton(x, y, "", "mod"));
for (const [x, y, label] of BUTTONS) document.getElementById("btnCol").appendChild(makeButton(x, y, label));

const padGrid = document.getElementById("padGrid"), sidebar = document.getElementById("sidebar");
for (let y = 7; y >= 0; y--) { // row 0 is bottom on the device
  for (let x = 0; x < 18; x++) {
    const el = document.createElement("div");
    el.className = "pad";
    el.innerHTML = `<div class="ring"></div>`;
    (x < 16 ? padGrid : sidebar).appendChild(el);
    padEls[y * 18 + x] = el;
  }
}
for (const m of ["meter-0", "meter-1"]) {
  const el = document.getElementById(m);
  for (let i = 0; i < 14; i++) el.appendChild(document.createElement("i"));
}

// ---------- RLE unpack (port of util/pack.c unpack_7to8_rle) ----------
function unpackRle(src) {
  const out = [];
  let s = 0;
  while (s + 1 < src.length) {
    let first = src[s++];
    if (first < 64) {
      let size, off;
      if (first < 4) { size = 2; off = 0; }
      else if (first < 12) { size = 3; off = 4; }
      else if (first < 28) { size = 4; off = 12; }
      else if (first < 60) { size = 5; off = 28; }
      else return null;
      if (size > src.length - s) return null;
      const highbits = first - off;
      for (let j = 0; j < size; j++) out.push((src[s + j] & 0x7f) | ((highbits & (1 << j)) ? 0x80 : 0));
      s += size;
    }
    else {
      first -= 64;
      const high = first & 1;
      let runlen = first >> 1;
      if (runlen === 31) { if (s >= src.length) return null; runlen = 31 + src[s++]; }
      if (s >= src.length) return null;
      const byte = (src[s++] & 0x7f) + 128 * high;
      for (let j = 0; j < runlen; j++) out.push(byte);
    }
  }
  return out;
}

// ---------- renderers ----------
const oledData = new Uint8Array(768);
const octx = document.getElementById("oled").getContext("2d");
function renderOled() {
  const img = octx.createImageData(128, 48);
  for (let y = 0; y < 48; y++) {
    for (let x = 0; x < 128; x++) {
      const lit = oledData[(y >> 3) * 128 + x] & (1 << (y & 7));
      const i = (y * 128 + x) * 4;
      img.data[i] = lit ? 190 : 8; img.data[i+1] = lit ? 235 : 10;
      img.data[i+2] = lit ? 255 : 14; img.data[i+3] = 255;
    }
  }
  octx.putImageData(img, 0, 0);
}
renderOled();

function renderPadRows(firstRow, bytes) {
  for (let i = 0; i + 2 < bytes.length; i += 3) {
    const idx = firstRow * 18 + (i / 3);
    const el = padEls[idx | 0];
    if (!el) continue;
    el.style.backgroundColor = `rgb(${bytes[i]},${bytes[i+1]},${bytes[i+2]})`;
  }
}

// gesture helpers
const holdTimers = {};
function pressVisual(el, key, on) {
  if (!el) return;
  if (on) {
    el.classList.remove("pressed"); void el.offsetWidth; // restart ripple
    el.classList.add("pressed");
    holdTimers[key] = setTimeout(() => el.classList.add("held"), 400);
  }
  else {
    el.classList.remove("pressed", "held");
    clearTimeout(holdTimers[key]);
  }
}
function turnVisual(id, delta) {
  const knob = document.getElementById(id);
  if (!knob) return;
  const dot = knob.querySelector(".dot");
  const cur = (parseFloat(knob.dataset.angle) || 0) + delta * 18;
  knob.dataset.angle = cur;
  dot.style.transform = `rotate(${cur}deg)`;
  const arrow = knob.querySelector(".arrow");
  arrow.className = "arrow " + (delta > 0 ? "cw" : "ccw");
  arrow.style.setProperty("--spin", (delta > 0 ? 60 : -60) + "deg");
  void arrow.offsetWidth;
  arrow.classList.add("show");
}

// ---------- event handling ----------
function handleEvent(type, a, b, c) {
  switch (type) {
    case 0: { const led = ledByCode[a]; if (led) led.classList.toggle("on", b !== 0); break; }
    case 1: { const meter = document.getElementById("meter-" + a);
              if (meter) { const segs = meter.children, lit = Math.round((b / 127) * segs.length);
                for (let i = 0; i < segs.length; i++) segs[i].classList.toggle("on", i < lit); }
              break; }
    case 2: { const knobId = ENC_CLICKS[a];
              if (knobId) { const k = document.getElementById(knobId); k.classList.toggle("pressed", b !== 0); }
              else pressVisual(btnByCode[a], "b" + a, b !== 0);
              break; }
    case 3: { const el = padEls[b * 18 + a];
              if (el) {
                if (c > 0) { el.classList.add("down"); el.classList.remove("hit"); void el.offsetWidth; el.classList.add("hit"); }
                else el.classList.remove("down");
              }
              break; }
    case 4: turnVisual(ENC_TURN[a], b - 64); break;
  }
}

// ---------- MIDI plumbing ----------
const HDR = [0xF0, 0x00, 0x21, 0x7B, 0x01];
let midiOut = null, keepaliveTimer = null, forcedOnce = false;
const statusEl = document.getElementById("status");

function matchesHdr(d) { return HDR.every((v, i) => d[i] === v) && d[5] === 0x02; }

function onMidiMessage(e) {
  const d = e.data;
  if (d[0] !== 0xF0 || !matchesHdr(d)) return;
  const t = d[6];
  if (t === 0x40 && d[7] === 2) { // OLED delta
    const bytes = unpackRle(d.slice(10, d.length - 1));
    if (bytes) { oledData.set(bytes.slice(0, Math.min(bytes.length, 768 - d[8] * 8)), d[8] * 8); renderOled(); }
  }
  else if (t === 0x42) { // pad rows
    const bytes = unpackRle(d.slice(10, d.length - 1));
    if (bytes) renderPadRows(d[8], bytes);
  }
  else if (t === 0x43) handleEvent(d[7], d[8], d[9], d[10]);
}

function subscribe() {
  if (!midiOut) return;
  const mode = forcedOnce ? 0x02 : 0x03;
  midiOut.send([...HDR, 0x02, 0x00, mode, 0xF7]); // display
  midiOut.send([...HDR, 0x02, 0x03, mode, 0xF7]); // panel state
  forcedOnce = true;
}

async function init() {
  if (!navigator.requestMIDIAccess) {
    statusEl.textContent = window.isSecureContext
      ? "This browser has no WebMIDI - use Chrome/Chromium, or Firefox 108+ (which will ask to install a MIDI site permission)."
      : "WebMIDI needs a secure context - serve this file over http://localhost (e.g. python3 -m http.server) instead of opening it directly.";
    return;
  }
  let access;
  try { access = await navigator.requestMIDIAccess({ sysex: true }); }
  catch (err) { statusEl.textContent = "WebMIDI denied: " + err; return; }
  const sel = document.getElementById("ports");
  const refresh = () => {
    sel.innerHTML = "";
    for (const out of access.outputs.values()) {
      const opt = document.createElement("option");
      opt.value = out.id; opt.textContent = out.name;
      if (/deluge/i.test(out.name) && !sel.querySelector("[data-deluge]")) { opt.selected = true; opt.dataset.deluge = 1; }
      sel.appendChild(opt);
    }
  };
  refresh();
  access.onstatechange = refresh;
  statusEl.textContent = "Pick the Deluge port and connect";

  document.getElementById("connect").onclick = () => {
    midiOut = access.outputs.get(sel.value);
    const outName = midiOut ? midiOut.name : null;
    for (const inp of access.inputs.values()) {
      if (inp.name === outName) inp.onmidimessage = onMidiMessage;
    }
    forcedOnce = false;
    clearInterval(keepaliveTimer);
    subscribe();
    keepaliveTimer = setInterval(subscribe, 1000);
    statusEl.textContent = "Streaming from " + outName;
    statusEl.className = "ok";
  };
}
init();
</script>
</body>
</html>
